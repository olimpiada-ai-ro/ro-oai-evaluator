name: Evaluator CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify public source boundary
        run: python .github/scripts/check_public_tree.py .

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan complete public tree for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==1.7.1

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run evaluator tests
        env:
          ENVIRONMENT: testing
        run: poetry run pytest
